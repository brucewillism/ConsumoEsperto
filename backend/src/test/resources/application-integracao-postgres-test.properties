spring.datasource.url=${INTEGRACAO_DATABASE_URL:jdbc:postgresql://localhost:5432/consumoesperto_integracao}
spring.datasource.username=${INTEGRACAO_DATABASE_USERNAME:postgres}
spring.datasource.password=${INTEGRACAO_DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
consumoesperto.schema.autopatch.enabled=false
spring.task.scheduling.enabled=false
jwt.secret=test_jwt_secret_key_for_integracao_postgres_tests_only_64chars_min
jwt.expiration=86400000
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test
