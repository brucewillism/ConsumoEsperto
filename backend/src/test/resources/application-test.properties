# =============================================================================
# CONFIGURAÇÕES DE TESTE - CONSUMO ESPERTO
# =============================================================================
# Este arquivo contém configurações específicas para testes unitários
# e de integração, permitindo que os testes rodem sem dependências externas
# =============================================================================

# =============================================================================
# CONFIGURAÇÕES BÁSICAS
# =============================================================================
spring.application.name=consumo-esperto-backend-test

# =============================================================================
# CONFIGURAÇÕES DE BANCO DE DADOS
# =============================================================================
# Local: H2 em memória. CI (DATABASE_URL no ambiente): Postgres do service container.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:test}
spring.datasource.driver-class-name=${TEST_DATASOURCE_DRIVER:org.h2.Driver}

# =============================================================================
# CONFIGURAÇÕES JPA/HIBERNATE PARA TESTES
# =============================================================================
spring.jpa.database-platform=${TEST_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:create}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =============================================================================
# FLYWAY — desligado em H2 local; ligado no CI com Postgres (TEST_FLYWAY_ENABLED=true)
# =============================================================================
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}
consumoesperto.schema.autopatch.enabled=false
spring.task.scheduling.enabled=false

# =============================================================================
# CONFIGURAÇÕES OAUTH2 (desabilitar validação em testes)
# =============================================================================
# Configurar valores vazios para evitar erro de validação
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# =============================================================================
# CONFIGURAÇÕES JWT PARA TESTES
# =============================================================================
jwt.secret=test_jwt_secret_key_for_testing_only_not_for_production_use_must_be_64_chars_min
jwt.expiration=86400000

# =============================================================================
# CONFIGURAÇÕES DE LOG PARA TESTES
# =============================================================================
logging.level.root=WARN
logging.level.com.consumoesperto=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# =============================================================================
# DESABILITAR FUNCIONALIDADES DESNECESSÁRIAS EM TESTES
# =============================================================================
management.endpoints.web.exposure.include=
spring.devtools.restart.enabled=false

