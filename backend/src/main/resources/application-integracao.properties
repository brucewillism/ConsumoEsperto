# Profile de integracao local — Flyway como fonte da verdade.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Outbox de autonomia: drain/retry precisa de @Scheduled. Jobs individuais têm as próprias flags.
spring.task.scheduling.enabled=true

# Patches de runtime desligados quando Flyway gerencia o schema
consumoesperto.schema.autopatch.enabled=false
