name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/mvn-backend.ps1'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'scripts/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: consumo
          POSTGRES_PASSWORD: consumo_ci
          POSTGRES_DB: consumoesperto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consumo -d consumoesperto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/consumoesperto_test
      DATABASE_USERNAME: consumo
      DATABASE_PASSWORD: consumo_ci
      JWT_SECRET: ci_jwt_secret_for_integracao_pipeline_only_64_chars_minimum
      TEST_DATASOURCE_DRIVER: org.postgresql.Driver
      TEST_JPA_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      TEST_DDL_AUTO: validate
      TEST_FLYWAY_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and verify backend
        working-directory: backend
        env:
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          consumoesperto.schema.autopatch.enabled: 'false'
        run: mvn --batch-mode clean verify

      - name: Check duplicate Flyway versions
        run: |
          dup=$(ls backend/src/main/resources/db/migration/V*.sql 2>/dev/null | sed 's/.*\///' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dup" ]; then echo "Versoes Flyway duplicadas: $dup"; exit 1; fi
          echo "Flyway versions OK"

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: ignore

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Maven dependency analyze
        working-directory: backend
        run: mvn --batch-mode dependency:analyze -DfailOnWarning=false
