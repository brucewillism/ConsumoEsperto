name: E2E CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'e2e/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/e2e-ci.yml'
  pull_request:
    branches: [main, develop]

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: consumo
          POSTGRES_PASSWORD: consumo_ci
          POSTGRES_DB: consumoesperto_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consumo -d consumoesperto_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/consumoesperto_e2e
      DATABASE_USERNAME: consumo
      DATABASE_PASSWORD: consumo_ci
      E2E_BASE_URL: http://localhost:14200
      E2E_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start backend
        working-directory: backend
        run: |
          mvn --batch-mode -DskipTests package
          java -jar target/*.jar &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 5; done

      - name: Set up Node frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and serve frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx --yes serve dist/frontend/browser -l 14200 &
          for i in $(seq 1 30); do curl -sf http://localhost:14200 && break; sleep 3; done

      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
