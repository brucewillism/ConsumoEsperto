name: Integracao Completa CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'e2e/**'
      - 'scripts/**'
      - '.github/workflows/integracao-completa-ci.yml'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: consumo
          POSTGRES_PASSWORD: consumo_ci
          POSTGRES_DB: consumoesperto_integracao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consumo -d consumoesperto_integracao"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/consumoesperto_integracao
      DATABASE_USERNAME: consumo
      DATABASE_PASSWORD: consumo_ci
      JWT_SECRET: ci_jwt_secret_for_integracao_pipeline_only_64_chars_minimum
      E2E_BASE_URL: http://localhost:14200
      E2E_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify (Flyway + validate)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: integracao
          SPRING_FLYWAY_ENABLED: 'true'
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          consumoesperto.schema.autopatch.enabled: 'false'
        run: mvn --batch-mode clean verify

      - name: Start backend JAR
        working-directory: backend
        env:
          SERVER_PORT: '8080'
          SPRING_PROFILES_ACTIVE: integracao
        run: |
          java -jar target/consumo-esperto-backend-*.jar &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 5; done

      - name: Smoke HTTP integral
        run: pwsh -File scripts/smoke-integracao.ps1 -BaseUrl http://localhost:8080

      - name: Set up Node frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run test:utils
          npm run test:angular
          npm run build:integracao
          node scripts/validate-integracao-bundle.mjs

      - name: Serve frontend
        working-directory: frontend/dist/frontend/browser
        run: |
          npx --yes serve -s -l 14200 &
          for i in $(seq 1 30); do curl -sf http://localhost:14200 && break; sleep 3; done
          curl -sf -o /dev/null -w "%{http_code}" http://localhost:14200/relatorios | grep -q 200

      - name: Playwright E2E
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integracao-playwright-report
          path: e2e/playwright-report/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
