name: Integracao Completa CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: consumo
          POSTGRES_PASSWORD: consumo_ci
          POSTGRES_DB: consumoesperto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consumo -d consumoesperto_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/consumoesperto_ci
      DATABASE_USERNAME: consumo
      DATABASE_PASSWORD: consumo_ci
      JWT_SECRET: ci-jwt-secret-minimo-32-chars-long!!
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: mvn --batch-mode -DskipTests package

      - name: Start backend JAR
        working-directory: backend
        run: |
          nohup java -jar target/consumo-esperto-backend-*.jar > ../backend-ci.log 2>&1 &
          echo $! > ../backend-ci.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/actuator/health > /dev/null; then
              echo "Backend UP (tentativa $i)"
              exit 0
            fi
            sleep 5
          done
          echo "Backend nao subiu em 5 minutos"
          tail -n 200 ../backend-ci.log || true
          exit 1

      - name: Smoke integracao HTTP
        run: pwsh -File scripts/smoke-integracao.ps1 -BaseUrl http://127.0.0.1:8080 -PararNoPrimeiroErro

      - name: Upload CI logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integracao-ci-logs
          path: |
            backend-ci.log
            logs/smoke-integracao-*.json
